[project]
name = "mcpapps-bridge-workspace"
version = "0.0.0"
description = "Development workspace for the MCP Apps Gateway backend."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "pyright>=1.1.390",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "packages/bridge-core",
  "packages/gateway-service",
  "apps/server",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["packages", "apps"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
