[project]
name = "mcp-gateway-service"
version = "0.0.0"
description = "Internal MCP gateway and Agent Host application services."
requires-python = ">=3.12"
dependencies = [
  "mcp-bridge-core",
  "pydantic>=2.8.0",
]

[tool.uv.sources]
mcp-bridge-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway_service"]