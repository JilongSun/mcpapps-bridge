[project]
name = "mabrid-application"
version = "0.0.0"
description = "Mabrid MCP Apps gateway, Agent Host, and widget application services."
requires-python = ">=3.12"
dependencies = [
  "anyio>=4,<5",
  "httpx>=0.27,<1",
  "httpx-sse>=0.4,<1",
  "mabrid-bridge",
  "openai>=2.24,<3",
  "pydantic>=2.8.0",
]

[tool.uv.sources]
mabrid-bridge = { workspace = true }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mabrid"]
