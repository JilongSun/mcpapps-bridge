[project]
name = "mcp-bridge-core"
version = "0.0.0"
description = "Internal MCP bridge protocol core."
requires-python = ">=3.12"
dependencies = [
  "anyio>=4.4.0",
  "mcp>=1.28,<2",
  "pydantic>=2.8.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bridge_core"]