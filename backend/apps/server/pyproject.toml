[project]
name = "mabrid-server"
version = "0.1.0"
description = "Internal deployable MCP gateway server composition."
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1",
  "alembic>=1.18.5",
  "anyio>=4.4.0",
  "fastapi>=0.115.0",
  "greenlet>=3.5.3",
  "mabrid-bridge",
  "mabrid-application",
  "openai>=2.24,<3",
  "pydantic>=2.8.0",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.3",
  "sqlalchemy>=2.0.51",
  "starlette>=0.27.0",
  "uvicorn>=0.30.0",
]

[project.scripts]
mabrid = "mabrid.server.main:main"

[tool.uv.sources]
mabrid-bridge = { workspace = true }
mabrid-application = { workspace = true }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mabrid"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "mabrid/server/persistence/migrations"
